name: CI Build

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

# A push and the matching pull_request event would otherwise both trigger
# the same build twice; cancel the older run when a newer one starts. Keying on
# the branch name rather than github.ref makes the two events share one group.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    uses: spring-ai-community/community-workflows/.github/workflows/ci-build.yml@main
    with:
      java-version: "21"
      maven-goals: clean verify -B

  # The manifest test also runs inside the suite above; the duplicate is
  # deliberate. It keeps the tamper-reject gate behind docs/mcp-owasp-top-10.md
  # MCP04 as an independently named check that stays green-or-red on its own,
  # so a required-check rule can point at it without depending on the whole build.
  integrity-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Verify default-tool integrity manifest
        run: ./mvnw -B test -Dtest=DefaultIntegrityManifestTest
