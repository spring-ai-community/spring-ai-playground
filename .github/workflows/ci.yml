name: CI Build

on:
  push:
    branches: [ "**" ]
  pull_request:

# A push and the matching pull_request event would otherwise both trigger
# the same build twice; cancel the older run when a newer one starts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: spring-ai-community/community-workflows/.github/workflows/ci-build.yml@main
    with:
      java-version: "21"
      maven-goals: clean verify -B
      skip-tests: true

  # The full suite stays skipped above (it needs Ollama, Docker, and a local
  # MCP venv), but the shipped default-tool integrity manifest is environment
  # independent and must hold on every push - the tamper-reject gate behind
  # docs/mcp-owasp-top-10.md MCP04.
  integrity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Verify default-tool integrity manifest
        run: ./mvnw -B test -Dtest=DefaultIntegrityManifestTest
