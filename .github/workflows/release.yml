name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish when running manually (example: v0.2.0-M2)"
        required: false
        type: string
  push:
    branches: [ "main" ]
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "docs-overrides/**"
      - "mkdocs.yml"
      - "docs/requirements.txt"
      - "README.md"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

# Cancel previous runs when a new push lands on the same branch.
# Tagged releases keep their own group so a tag never cancels a main push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # 1. Build the platform-independent fat JAR ONCE.
  # Both the Docker matrix and the desktop installer matrix consume this
  # artifact, so the entire release run materialises a single `mvn package`
  # call instead of 5 (was: 1 inside Docker + 4 across the desktop OS matrix).
  build-jar:
    name: Build fat JAR (shared)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Build Spring Boot production JAR
        run: ./mvnw -q -DskipTests -Pproduction package

      - name: Upload Spring Boot fat JAR
        uses: actions/upload-artifact@v6
        with:
          name: spring-ai-playground-jar
          path: |
            target/spring-ai-playground-*.jar
            !target/spring-ai-playground-*.jar.original
          if-no-files-found: error

  # 2. Per-arch Docker build on a NATIVE runner (no QEMU).
  # GitHub provides free `ubuntu-24.04-arm` for public repos, so arm64 builds
  # run on real hardware and are 2–3× faster than QEMU emulation. Each job
  # downloads the pre-built JAR from build-jar so the Docker build skips the
  # in-image Maven phase entirely (the Dockerfile detects target/*.jar in
  # the build context and short-circuits the mvn package step).
  build-container:
    needs: build-jar
    strategy:
      # Cancel remaining arches if one fails — publish never proceeds with a
      # partial multi-arch image, so finishing the other arch only burns CI.
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v5

      # The Dockerfile detects an existing target/*.jar in the build context
      # and skips the in-image Maven build. We download the artifact straight
      # into target/; .dockerignore lets the JAR file through while still
      # excluding everything else under target/.
      - name: Download pre-built fat JAR
        uses: actions/download-artifact@v6
        with:
          name: spring-ai-playground-jar
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-platform digest output; manifest tags are attached in the
          # `merge-container` job so a single manifest list points at both
          # digests.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
          # Per-platform GHA cache scope. mode=max exports intermediate
          # layers and BuildKit cache-mount data so a re-run that doesn't
          # change pom.xml reuses the dependency layer.
          cache-from: |
            type=gha,scope=release-container-${{ env.PLATFORM_PAIR }}
          cache-to: |
            type=gha,mode=max,scope=release-container-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 3. Stitch the per-platform digests into a single multi-arch manifest list
  # and tag it. Cheap (~30s) and only runs when the build jobs actually
  # pushed images.
  merge-container:
    needs: build-container
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (manifest tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.release_tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          # Intentional word-splitting: $(jq...) expands to "-t tag1 -t tag2 ..."
          # and $(printf ...) expands each digest into its own argument.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # 4. Per-OS desktop installer matrix.
  # Same JAR as the container build; the matrix only owns the platform-
  # specific work (jlink for the bundled JRE + electron-builder for the
  # native installer format).
  build-installer:
    needs: build-jar
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # Cancel remaining OS slots if one fails — publish-release won't ship a
      # release missing any platform, so the surviving slots would just burn
      # CI minutes for no artifact that ends up in the release.
      fail-fast: true
      matrix:
        include:
          - name: macOS DMG (Apple Silicon)
            runs_on: macos-14
            dist_command: npm run dist:mac:dmg
            artifact_name: spring-ai-playground-macos-arm64-dmg
            artifact_paths: |
              electron/dist/*arm64*.dmg

          - name: macOS DMG (Intel)
            runs_on: macos-15-intel
            dist_command: npm run dist:mac:dmg
            artifact_name: spring-ai-playground-macos-x64-dmg
            artifact_paths: |
              electron/dist/*x64*.dmg

          - name: Windows NSIS
            runs_on: windows-latest
            dist_command: npm run dist:win
            artifact_name: spring-ai-playground-windows-nsis
            artifact_paths: |
              electron/dist/*.exe

          # Linux DEB and RPM run as separate matrix entries so each format
          # builds on its own runner in parallel. `electron-builder --linux deb rpm`
          # would otherwise build them sequentially inside one job.
          - name: Linux DEB
            runs_on: ubuntu-latest
            dist_command: npm run dist:linux:deb
            artifact_name: spring-ai-playground-linux-deb
            artifact_paths: |
              electron/dist/*.deb

          - name: Linux RPM
            runs_on: ubuntu-latest
            dist_command: npm run dist:linux:rpm
            artifact_name: spring-ai-playground-linux-rpm
            artifact_paths: |
              electron/dist/*.rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve installer version
        id: ver
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.release_tag }}"
          REF="${{ github.ref_name }}"
          # Priority: workflow_dispatch input > ref name > pom.xml fallback.
          CANDIDATE="${INPUT:-$REF}"
          VERSION=""
          if [[ "$CANDIDATE" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            SOURCE="ref/input ($CANDIDATE)"
          elif [[ "$CANDIDATE" =~ ^([0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            SOURCE="ref/input ($CANDIDATE)"
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -A1 '<artifactId>spring-ai-playground</artifactId>' pom.xml \
              | grep '<version>' | head -1 \
              | sed -E 's@.*<version>([^<]+)</version>.*@\1@')
            SOURCE="pom.xml (ref=$REF)"
            # Surface a warning so a non-tag push that falls back to pom.xml
            # doesn't silently produce mismatched-version installers when
            # pom.xml hasn't been bumped to the next milestone yet (this is
            # how M4-named assets ended up in the v0.2.0-M5 draft).
            echo "::warning title=Release version from pom.xml fallback::ref='$REF' did not contain a version, so installers are tagged $VERSION from pom.xml. Confirm pom.xml is bumped to the upcoming milestone before tagging the release."
          fi
          # Normalize milestone marker case (e.g., -m4 -> -M4).
          VERSION=$(echo "$VERSION" | sed -E 's/-m([0-9]+)/-M\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve installer version from ref or pom.xml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved installer version: $VERSION (source: $SOURCE)"

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Download pre-built fat JAR
        uses: actions/download-artifact@v6
        with:
          name: spring-ai-playground-jar
          path: target

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Set installer version on electron/package.json
        working-directory: electron
        shell: bash
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install frontend dependencies
        if: hashFiles('package.json') != ''
        run: npm install --no-audit --no-fund

      - name: Prepare bundled resources
        working-directory: electron
        run: npm run prepare:resources

      - name: Build desktop installer
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.dist_command }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  # 5. Aggregate installers + JAR into a single GitHub Release with
  # SHA-256 checksums and Sigstore SLSA build provenance attestations.
  #
  # Atomic release: depends on BOTH the desktop matrix (`build-installer`)
  # and the Docker manifest (`merge-container`). If either track fails,
  # this job skips, so the GitHub Release is never created without a
  # matching multi-arch image (and vice versa: a partial Docker push with
  # missing installers also won't appear as a published release).
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    needs: [build-installer, merge-container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write       # required for Sigstore OIDC token used by build provenance
      attestations: write   # required to write the attestation back to the repo

    steps:
      # Download only the installer + JAR artifacts; the digests-* artifacts
      # from build-container are internal to the manifest merge job and must
      # not end up in the release zip.
      - name: Download installer and JAR artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          pattern: spring-ai-playground-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          shopt -s nullglob
          for f in *.dmg *.exe *.deb *.rpm *.jar; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.jar

      # Tag-triggered releases (re)assemble the published artefact set from
      # scratch, so wipe any stale assets the existing draft might have
      # accumulated from earlier runs. Without this, softprops adds new files
      # alongside old ones, which is how M4-named installers ended up living
      # inside the v0.2.0-M5 draft. Restricted to tag pushes / dispatch so a
      # main-push draft (which uses tag_name=`main`) doesn't disturb anything.
      - name: Wipe stale assets from existing release draft
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | while IFS= read -r name; do
                  [ -n "$name" ] || continue
                  echo "Deleting stale asset: $name"
                  gh release delete-asset "$TAG" "$name" --yes --repo "$GITHUB_REPOSITORY" || true
                done
          else
            echo "No existing release for tag $TAG; nothing to wipe."
          fi

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          draft: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.jar
            release-assets/*.sha256
          generate_release_notes: true
