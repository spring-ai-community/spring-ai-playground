name: Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG (Apple Silicon)
            runs_on: macos-14
            dist_command: npm run dist:mac:dmg
            artifact_name: spring-ai-playground-macos-arm64-dmg
            artifact_paths: |
              electron/dist/*arm64*.dmg

          - name: macOS DMG (Intel)
            runs_on: macos-13
            dist_command: npm run dist:mac:dmg
            artifact_name: spring-ai-playground-macos-x64-dmg
            artifact_paths: |
              electron/dist/*x64*.dmg

          - name: Windows NSIS
            runs_on: windows-latest
            dist_command: npm run dist:win
            artifact_name: spring-ai-playground-windows-nsis
            artifact_paths: |
              electron/dist/*.exe

          - name: Linux DEB/RPM
            runs_on: ubuntu-latest
            dist_command: npm run dist:linux
            artifact_name: spring-ai-playground-linux-installers
            artifact_paths: |
              electron/dist/*.deb
              electron/dist/*.rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: electron/package-lock.json

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build Spring Boot production JAR
        run: ./mvnw -q -DskipTests -Pproduction package

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Prepare bundled resources
        working-directory: electron
        run: npm run prepare:resources

      - name: Build desktop installer
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.dist_command }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

      - name: Upload assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: ${{ matrix.artifact_paths }}
          generate_release_notes: true