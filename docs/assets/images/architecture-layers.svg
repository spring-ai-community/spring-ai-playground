<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 886" role="img" aria-label="Spring AI Playground runtime layers - desktop launcher, UI surfaces including Shipyard, backend services including Shipyard and the management tools, Spring AI integration, external runtimes including Docker engines">
  <defs>
    <style>
      .band { stroke: #c9d3e0; stroke-width: 1; }
      .band-1 { fill: #fdf6ec; }
      .band-2 { fill: #eef5ff; }
      .band-3 { fill: #eef9f1; }
      .band-4 { fill: #f4eefb; }
      .band-5 { fill: #fbeef1; }
      .layer-title { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #1f2937; }
      .layer-sub { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #7c93af; stroke-width: 1; }
      .box-label { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #1f2937; text-anchor: middle; }
      .box-sub { font: 400 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #4b5563; text-anchor: middle; }
      .arrow { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Layer 1 -->
  <rect class="band band-1" x="10" y="10" width="940" height="104" rx="8" ry="8"/>
  <text class="layer-title" x="30" y="32">Layer 1 - Desktop Launcher (Electron)</text>
  <text class="layer-sub" x="30" y="50">Optional packaging, process lifecycle, OS-encrypted secrets</text>
  <rect class="box" x="30" y="62" width="440" height="40" rx="6" ry="6"/>
  <text class="box-label" x="250" y="86">main.js · launcher-config.js · ollama-manager.js</text>
  <rect class="box" x="490" y="62" width="440" height="40" rx="6" ry="6"/>
  <text class="box-label" x="710" y="80">OS secure storage</text>
  <text class="box-sub" x="710" y="96">Keychain / DPAPI → encrypted secrets.enc (keys · env)</text>

  <path class="arrow" d="M480,114 L480,134"/>

  <!-- Layer 2 -->
  <rect class="band band-2" x="10" y="134" width="940" height="116" rx="8" ry="8"/>
  <text class="layer-title" x="30" y="158">Layer 2 - UI Surfaces (Vaadin Flow)</text>
  <text class="layer-sub" x="30" y="176">Hand-written views under webui/</text>
  <rect class="box" x="30" y="192" width="122" height="46" rx="6" ry="6"/>
  <text class="box-label" x="91" y="220">Home</text>
  <rect class="box" x="160" y="192" width="122" height="46" rx="6" ry="6"/>
  <text class="box-label" x="221" y="220">Tool Studio</text>
  <rect class="box" x="290" y="192" width="122" height="46" rx="6" ry="6"/>
  <text class="box-label" x="351" y="220">MCP Server</text>
  <rect class="box" x="420" y="192" width="122" height="46" rx="6" ry="6"/>
  <text class="box-label" x="481" y="220">Vector Database</text>
  <rect class="box" x="550" y="192" width="122" height="46" rx="6" ry="6"/>
  <text class="box-label" x="611" y="220">Agentic Chat</text>
  <rect class="box" x="680" y="192" width="122" height="46" rx="6" ry="6"/>
  <text class="box-label" x="741" y="220">Shipyard</text>
  <rect class="box" x="810" y="192" width="122" height="46" rx="6" ry="6"/>
  <text class="box-label" x="871" y="220">Observability</text>

  <path class="arrow" d="M480,250 L480,270"/>

  <!-- Layer 3 -->
  <rect class="band band-3" x="10" y="270" width="940" height="198" rx="8" ry="8"/>
  <text class="layer-title" x="30" y="294">Layer 3 - Backend Services</text>
  <text class="layer-sub" x="30" y="312">Per-feature services under service/ · plus the top-level observability/ pipeline</text>
  <rect class="box" x="30" y="324" width="290" height="44" rx="6" ry="6"/>
  <text class="box-label" x="175" y="344">ChatService</text>
  <text class="box-sub" x="175" y="361">ChatHistoryService · HeadlessChatService</text>
  <rect class="box" x="335" y="324" width="290" height="44" rx="6" ry="6"/>
  <text class="box-label" x="480" y="344">ToolSpecService</text>
  <text class="box-sub" x="480" y="361">JsToolExecutor · sandbox policy · risk</text>
  <rect class="box" x="640" y="324" width="290" height="44" rx="6" ry="6"/>
  <text class="box-label" x="785" y="344">McpClientService</text>
  <text class="box-sub" x="785" y="361">McpServerInfoService · OAuth 2.1 · catalog</text>
  <rect class="box" x="30" y="372" width="290" height="44" rx="6" ry="6"/>
  <text class="box-label" x="175" y="392">VectorStoreService</text>
  <text class="box-sub" x="175" y="409">KnowledgeIngestService · RagPipelineService</text>
  <rect class="box" x="335" y="372" width="290" height="44" rx="6" ry="6"/>
  <text class="box-label" x="480" y="392">ShipyardService</text>
  <text class="box-sub" x="480" y="409">BundleRegistryService · contributions · Docker targets</text>
  <rect class="box" x="640" y="372" width="290" height="44" rx="6" ry="6"/>
  <text class="box-label" x="785" y="392">Management tools (saip_*)</text>
  <text class="box-sub" x="785" y="409">ManagementApprovalGate · contributions · audit log</text>
  <rect class="box" x="30" y="420" width="290" height="44" rx="6" ry="6"/>
  <text class="box-label" x="175" y="440">MCP risk &amp; exposure</text>
  <text class="box-sub" x="175" y="457">McpExposureService · risk calculators · hash ledger</text>
  <rect class="box" x="335" y="420" width="290" height="44" rx="6" ry="6"/>
  <text class="box-label" x="480" y="440">Observability</text>
  <text class="box-sub" x="480" y="457">Collector · RingBuffer · TimeSeries (observability/)</text>
  <rect class="box" x="640" y="420" width="290" height="44" rx="6" ry="6"/>
  <text class="box-label" x="785" y="440">Util</text>
  <text class="box-sub" x="785" y="457">SecretMasking · EnvVarResolver · Identity</text>

  <path class="arrow" d="M480,468 L480,488"/>

  <!-- Layer 4 -->
  <rect class="band band-4" x="10" y="488" width="940" height="180" rx="8" ry="8"/>
  <text class="layer-title" x="30" y="512">Layer 4 - Spring AI Integration</text>
  <text class="layer-sub" x="30" y="530">Thin adapters wired via Spring beans - ChatClient, advisors, MCP, vector, embedding</text>
  <rect class="box" x="30" y="542" width="290" height="58" rx="6" ry="6"/>
  <text class="box-label" x="175" y="564">ChatClient · Advisor chain</text>
  <text class="box-sub" x="175" y="584">MessageChatMemory · RAG · Logger · HITL</text>
  <rect class="box" x="335" y="542" width="290" height="58" rx="6" ry="6"/>
  <text class="box-label" x="480" y="564">VectorStore · EmbeddingModel</text>
  <text class="box-sub" x="480" y="584">RetrievalAugmentationAdvisor · SimpleStore</text>
  <rect class="box" x="640" y="542" width="290" height="58" rx="6" ry="6"/>
  <text class="box-label" x="785" y="564">ChatMemory</text>
  <text class="box-sub" x="785" y="584">MessageWindowChatMemory (last 10)</text>
  <rect class="box" x="30" y="608" width="290" height="58" rx="6" ry="6"/>
  <text class="box-label" x="175" y="630">AgentLoopManager</text>
  <text class="box-sub" x="175" y="650">implements Spring AI ToolCallingManager · HITL gate</text>
  <rect class="box" x="335" y="608" width="290" height="58" rx="6" ry="6"/>
  <text class="box-label" x="480" y="630">MCP Server</text>
  <text class="box-sub" x="480" y="650">built-in · /mcp · your tools + saip_* management tools</text>
  <rect class="box" x="640" y="608" width="290" height="58" rx="6" ry="6"/>
  <text class="box-label" x="785" y="630">MCP Client</text>
  <text class="box-sub" x="785" y="650">spring-ai-starter-mcp-client → external</text>

  <path class="arrow" d="M480,668 L480,688"/>

  <!-- Layer 5 -->
  <rect class="band band-5" x="10" y="688" width="940" height="188" rx="8" ry="8"/>
  <text class="layer-title" x="30" y="712">Layer 5 - External Runtimes</text>
  <text class="layer-sub" x="30" y="730">Everything outside the JVM</text>
  <rect class="box" x="30" y="748" width="172" height="118" rx="6" ry="6"/>
  <text class="box-label" x="116" y="772">Model providers</text>
  <text class="box-sub" x="116" y="792">Ollama (local, default)</text>
  <text class="box-sub" x="116" y="810">OpenAI · OpenAI-compatible</text>
  <text class="box-sub" x="116" y="828">(llama.cpp · LM Studio · vLLM)</text>
  <rect class="box" x="212" y="748" width="172" height="118" rx="6" ry="6"/>
  <text class="box-label" x="298" y="772">Vector databases</text>
  <text class="box-sub" x="298" y="792">(optional, opt-in build)</text>
  <text class="box-sub" x="298" y="810">pgvector · Weaviate</text>
  <text class="box-sub" x="298" y="828">Qdrant · Milvus · ...</text>
  <rect class="box" x="394" y="748" width="172" height="118" rx="6" ry="6"/>
  <text class="box-label" x="480" y="772">External MCP servers</text>
  <text class="box-sub" x="480" y="792">STDIO (spawned process)</text>
  <text class="box-sub" x="480" y="810">Streamable HTTP</text>
  <text class="box-sub" x="480" y="828">SSE (legacy)</text>
  <rect class="box" x="576" y="748" width="172" height="118" rx="6" ry="6"/>
  <text class="box-label" x="662" y="772">Docker engines</text>
  <text class="box-sub" x="662" y="792">local or remote Shipyard targets</text>
  <text class="box-sub" x="662" y="810">one image per shipped server</text>
  <text class="box-sub" x="662" y="828">the MCP servers you shipped</text>
  <rect class="box" x="758" y="748" width="172" height="118" rx="6" ry="6"/>
  <text class="box-label" x="844" y="772">Apache Tika</text>
  <text class="box-sub" x="844" y="792">Document readers</text>
  <text class="box-sub" x="844" y="810">PDF · DOCX · HTML</text>
  <text class="box-sub" x="844" y="828">and others</text>
</svg>
